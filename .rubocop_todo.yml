# Empty initially. Cimas sync will populate this with grandfathered
# offenses as the codebase grows. Keep this file last in .rubocop.yml's
# inherit_from list (see comment there).

# Anti-pattern spec is intentionally written with parameterized describe
# using local variables from the surrounding scope. Matches the sts-ruby
# pattern. Excluded from RSpec cops wholesale.
RSpec:
  Exclude:
    - spec/anti_patterns_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/anti_patterns_spec.rb

Layout/LineLength:
  Exclude:
    - spec/anti_patterns_spec.rb

# Integration-style specs naturally need more expectations and lines.
# Round-trip and write tests bundle related assertions per scenario.
RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 5

# Part models have large `xml do ... end` blocks with one declaration per
# line. The size scales with the number of IDML attributes the part
# exposes; this is intentional, not a code smell.
Metrics/BlockLength:
  Exclude:
    - lib/idml/parts/**/*.rb
