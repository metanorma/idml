# Empty initially. Cimas sync will populate this with grandfathered
# offenses as the codebase grows. Keep this file last in .rubocop.yml's
# inherit_from list (see comment there).

# Anti-pattern spec is intentionally written with parameterized describe
# using local variables from the surrounding scope. Matches the sts-ruby
# pattern. Excluded from RSpec cops wholesale.
RSpec:
  Exclude:
    - spec/anti_patterns_spec.rb
    - spec/idml/round_trip_all_fixtures_spec.rb
    - spec/idml/elements_spec.rb

RSpec/DescribeClass:
  Exclude:
    - spec/anti_patterns_spec.rb
    - spec/idml/round_trip_spec.rb
    - spec/idml/round_trip_all_fixtures_spec.rb
    - spec/idml/elements_spec.rb

RSpec/BeforeAfterAll:
  Exclude:
    - spec/idml/elements_spec.rb

RSpec/SpecFilePathFormat:
  Exclude:
    - spec/idml/composition/composition_spec.rb
    - spec/idml/render/render_spec.rb

RSpec/SpecFilePathSuffix:
  Exclude:
    - spec/idml/composition/composition_spec.rb
    - spec/idml/render/render_spec.rb

Layout/LineLength:
  Exclude:
    - spec/anti_patterns_spec.rb
    - spec/idml/composition/**/*.rb
    - spec/idml/validation/validator_spec.rb
    - spec/idml/render/**/*.rb
    - scripts/**/*.rb
    - lib/idml/composition/**/*.rb
    - lib/idml/elements/**/*.rb
    - lib/idml/parts/**/*.rb
    - lib/idml/render/**/*.rb
    - lib/idml/text_engine/**/*.rb

Metrics/ParameterLists:
  Exclude:
    - lib/idml/text_engine/**/*.rb
    - lib/idml/render/**/*.rb

RSpec/MultipleDescribes:
  Exclude:
    - spec/idml/composition/composition_spec.rb
    - spec/idml/text_engine/text_engine_spec.rb

# Integration-style specs naturally need more expectations and lines.
# Round-trip and write tests bundle related assertions per scenario.
RSpec/ExampleLength:
  Max: 30

RSpec/MultipleExpectations:
  Max: 6

# Part and element models have large `xml do ... end` blocks with one
# declaration per attribute. Size scales with the RNC; this is
# intentional, not a code smell. Same applies to the codegen scripts.
Metrics/BlockLength:
  Exclude:
    - lib/idml/parts/**/*.rb
    - lib/idml/elements/**/*.rb
    - lib/idml/render/**/*.rb
    - scripts/**/*.rb

# CLI methods are linear output routines; their length is proportional
# to the number of subcommands they describe.
Metrics/MethodLength:
  Max: 15
  Exclude:
    - scripts/**/*.rb
    - lib/idml/composition/**/*.rb
    - lib/idml/text_engine/**/*.rb
    - lib/idml/render/**/*.rb

Metrics/AbcSize:
  Exclude:
    - scripts/**/*.rb
    - lib/idml/geometry.rb
    - lib/idml/composition/**/*.rb
    - lib/idml/text_engine/**/*.rb
    - lib/idml/render/**/*.rb

Metrics/PerceivedComplexity:
  Exclude:
    - scripts/**/*.rb
    - lib/idml/text_engine/**/*.rb

Metrics/CyclomaticComplexity:
  Exclude:
    - scripts/**/*.rb
    - lib/idml/text_engine/**/*.rb

Lint/DuplicateBranch:
  Exclude:
    - scripts/**/*.rb

# `x` and `y` are conventional coordinate names; renaming to `x_coord`
# would harm readability without improving clarity.
Naming/MethodParameterName:
  Exclude:
    - lib/idml/geometry.rb
    - lib/idml/render/**/*.rb
